    // Strict Arabic Normalization Utility: Distinguish Sin (س) vs Syin (ش)
    function normalizeArabicStrict(text) {
      if (!text) return '';
      return text
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '') // Remove harakat / tashkeel
        .replace(/[إأآٱ]/g, 'ا') // Normalize alif variations
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[\u06D4\u060C\u061B\u061F\.\,\?\!]/g, '') // Punctuation
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Helper: Dynamic Target Calculation (Never resets to zero!)
    function calculateDynamicTarget(verseStatusMap, targetCount = 5, preferredSurah = 78) {
      let startSurah = preferredSurah;
      let startAyah = 1;

      const memorizedKeys = Object.keys(verseStatusMap || {}).filter(
        (k) => verseStatusMap[k] === 'memorized' || verseStatusMap[k] === 'mastered'
      );

      if (memorizedKeys.length > 0) {
        const parsed = memorizedKeys.map((k) => {
          const [s, a] = k.split(':').map(Number);
          return { surah: s, ayah: a };
        });
        parsed.sort((a, b) => a.surah !== b.surah ? a.surah - b.surah : a.ayah - b.ayah);
        const last = parsed[parsed.length - 1];
        const sMeta = SURAHS_META.find(s => s.number === last.surah) || SURAHS_META[0];

        if (last.ayah < sMeta.totalVerses) {
          startSurah = last.surah;
          startAyah = last.ayah + 1;
        } else {
          startSurah = last.surah < 114 ? last.surah + 1 : 1;
          startAyah = 1;
        }
      }

      const surahMeta = SURAHS_META.find(s => s.number === startSurah) || SURAHS_META[6];
      const ayahEnd = Math.min(startAyah + targetCount - 1, surahMeta.totalVerses);

      const verses = [];
      for (let a = startAyah; a <= ayahEnd; a++) {
        const key = `${startSurah}:${a}`;
        const isDone = verseStatusMap[key] === 'memorized' || verseStatusMap[key] === 'mastered';
        verses.push({
          surahNumber: startSurah,
          surahName: surahMeta.nameLatin,
          ayahNumber: a,
          completed: isDone,
        });
      }

      return {
        surahNumber: startSurah,
        surahName: surahMeta.nameLatin,
        ayahStart: startAyah,
        ayahEnd,
        verses,
        isCompleted: verses.length > 0 && verses.every(v => v.completed)
      };
    }

    // --- Main React Component ---
    function HafizApp() {
      // User Profile & Storage State
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('hafiz_user');
          return saved ? JSON.parse(saved) : { id: 'guest_user', name: 'Sahabat Santri', email: 'santri@hafiz.ai' };

          return { id: 'guest_user', name: 'Sahabat Santri', email: 'santri@hafiz.ai' };
        }
      });

      // User Memorization Progress State
      const [progress, setProgress] = useState(() => {
        try {
          const savedProg = localStorage.getItem('hafiz_progress_data');
          if (savedProg) return JSON.parse(savedProg);
        } catch {}
        return {
          verseStatusMap: {},

      const [notification, setNotification] = useState(null);
      const [isRecordModalOpen, setIsRecordModalOpen] = useState(false);
      const [isSelectorModalOpen, setIsSelectorModalOpen] = useState(false);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [emailInput, setEmailInput] = useState('');
      const [nameInput, setNameInput] = useState('');

      // Audio Reciter State
      const [playingAyahKey, setPlayingAyahKey] = useState(null);
      const audioPlayerRef = useRef(null);

      // Quiz State
      const [quizQuestion, setQuizQuestion] = useState(null);
      const [quizInputText, setQuizInputText] = useState('');
      const [quizFeedback, setQuizFeedback] = useState(null);

      // Save to LocalStorage permanently whenever progress updates
      useEffect(() => {
        try {
          localStorage.setItem('hafiz_progress_data', JSON.stringify(progress));
          localStorage.setItem('hafiz_user', JSON.stringify(user));
        } catch (e) {
          console.warn('Persistence sync error:', e);
        }
      }, [progress, user]);

      // Dynamic 5-Ayah Target based on memorization status
      const currentTarget = useMemo(() => {
        return calculateDynamicTarget(progress.verseStatusMap, 5, 78);
      }, [progress.verseStatusMap]);

      // Confetti Trigger
      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.6 },
            colors: ['#059669', '#d97706', '#10b981', '#fbbf24']
          });
        }
      };

      // Toast Notification
      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      // Toggle Verse Checkbox Completion
      const toggleVerse = (surahNum, ayahNum) => {
        const key = `${surahNum}:${ayahNum}`;
        const isCurrentlyMemorized = progress.verseStatusMap[key] === 'memorized';
        const nextStatus = isCurrentlyMemorized ? 'learning' : 'memorized';

        const updatedMap = {
          ...progress.verseStatusMap,
          [key]: nextStatus
        };

        let updatedStars = progress.totalStars;
        if (!isCurrentlyMemorized) {
          updatedStars += 1;
          showToast(`Alhamdulillah! Ayat ${ayahNum} berhasil ditandai selesai (+1 Bintang).`);
        }

        setProgress(prev => ({
          ...prev,
          verseStatusMap: updatedMap,
          totalStars: updatedStars
        }));
      };

      // Play Quran Audio (Sheikh Mishary Rashid Alafasy)
      const playAyahAudio = (surahNum, ayahNum) => {
        const key = `${surahNum}:${ayahNum}`;
        if (playingAyahKey === key) {
          if (audioPlayerRef.current) audioPlayerRef.current.pause();
          setPlayingAyahKey(null);
          return;
        }

        const url = getAlafasyAudioUrl(surahNum, ayahNum);
        if (!audioPlayerRef.current) {
          audioPlayerRef.current = new Audio(url);
          audioPlayerRef.current.onended = () => setPlayingAyahKey(null);
        } else {
          audioPlayerRef.current.src = url;
        }

        audioPlayerRef.current.play().then(() => {
          setPlayingAyahKey(key);
        }).catch(() => {
          showToast("Koneksi audio murattal gagal. Memeriksa jaringan...");
        });
      };

      // Handle Login with Email (Deterministic Account Restoration)
      const handleLogin = (e) => {
        e.preventDefault();
        if (!emailInput.trim()) return;
        const normalized = emailInput.trim().toLowerCase();
        const accountId = 'usr_' + btoa(normalized).replace(/=/g, '').slice(0, 16);
        const newUser = {
          id: accountId,
          name: nameInput.trim() || normalized.split('@')[0],
          email: normalized

        setUser(newUser);
        setIsAuthModalOpen(false);
        showToast(`Selamat datang kembali, ${newUser.name}! Data hafalan Anda tersinkronisasi.`);
      };

      // Initialize / Next Quiz Question (Strict RTL & Accurate Arabic Normalization)
      const setupNewQuiz = () => {
        setQuizInputText('');
        setQuizFeedback(null);
        const versesList = Object.values(INITIAL_AYAT_DB);
        const randomAyah = versesList[Math.floor(Math.random() * versesList.length)];
        const words = randomAyah.textArabic.split(' ');
        const missingIdx = Math.floor(Math.random() * words.length);
        const missingWord = words[missingIdx];
        
        const promptArabic = words.map((w, i) => i === missingIdx ? '______' : w).join(' ');

        setQuizQuestion({
          surahNumber: randomAyah.surahNumber,
          ayahNumber: randomAyah.numberInSurah,
          promptArabic,
          missingWord,
          fullArabic: randomAyah.textArabic,
          translation: randomAyah.translationId
        });
      };

      const evaluateQuiz = () => {
        if (!quizQuestion || !quizInputText.trim()) return;
        const typedClean = normalizeArabicStrict(quizInputText);
        const expectedClean = normalizeArabicStrict(quizQuestion.missingWord);

        // Strict Arabic match (No false positives like س vs ش)
        if (typedClean === expectedClean) {
          setQuizFeedback({
            correct: true,
            msg: "MashaAllah, Mumtaz! Jawaban Anda Tepat Sekali."
          });
          triggerConfetti();
          setProgress(prev => ({ ...prev, totalStars: prev.totalStars + 3 }));
        } else {
          setQuizFeedback({
            correct: false,
            msg: `Perhatikan kembali: Huruf/harakat yang tepat adalah: "${quizQuestion.missingWord}"`
          });
        }
      };

      // Voice Recitation Simulator & Recorder State
      const [isRecording, setIsRecording] = useState(false);
      const [recordSeconds, setRecordSeconds] = useState(0);
      const [recordedBlobUrl, setRecordedBlobUrl] = useState(null);
      const [evalResult, setEvalResult] = useState(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerRef = useRef(null);

      const startRecording = async () => {
        setRecordedBlobUrl(null);
        setEvalResult(null);
        setRecordSeconds(0);

            stream.getTracks().forEach(t => t.stop());
          };

          recorder.start(250);
          setIsRecording(true);
          timerRef.current = setInterval(() => setRecordSeconds(s => s + 1), 1000);

                    <div className="w-full mt-3 p-3 bg-white rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                      <audio controls src={recordedBlobUrl} className="h-8 flex-1"></audio>
                      <button onClick={submitRecitation} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow hover:bg-emerald-700">
                        Evaluasi & Simpan AI ✨
                      </button>
                    </div>
                  )}
                </div>

                {/* AI Evaluation Results */}
                {evalResult && (
                  <div className="p-5 bg-emerald-950 text-white rounded-2xl space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[10px] text-amber-300 uppercase font-bold tracking-wider">Hasil Evaluasi AI</span>
                        <h4 className="text-xl font-bold text-white mt-0.5">MashaAllah, Mumtaz!</h4>
                      </div>
                      <div className="text-right">
                        <span className="text-3xl font-black text-amber-400">{evalResult.score}</span>
                        <span className="text-xs text-emerald-300 block">/ 100 Poin</span>
                      </div>
                    </div>

                    <div className="p-3 bg-emerald-900/60 rounded-xl border border-emerald-800 text-xs">
                      {evalResult.feedback}
                    </div>

                    <div className="text-right font-quran text-xl leading-loose p-3 bg-emerald-900/40 rounded-xl" dir="rtl">
                      {evalResult.wordFeedback.map((wf, i) => (
                        <span key={i} className={`inline-block px-1.5 py-0.5 rounded mx-1 ${wf.status === 'correct' ? 'bg-emerald-600/40 text-emerald-200' : 'bg-amber-500/40 text-amber-200'}`}>
                          {wf.word}
                        </span>
                      ))}
                    </div>

                    <button
                      onClick={() => setIsRecordModalOpen(false)}
                      className="w-full py-2.5 bg-amber-400 text-emerald-950 rounded-xl font-bold text-xs"
                    >
                      Selesai & Simpan Permanen
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL 2: SURAH TARGET SELECTOR */}
          {isSelectorModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-emerald-100 max-h-[85vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base text-slate-900">Pilih Surat Target Hafalan</h3>
                  <button onClick={() => setIsSelectorModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="space-y-2">
                  {SURAHS_META.map(s => (
                    <button
                      key={s.number}
                      onClick={() => {
                        const newMap = { ...progress.verseStatusMap };
                        // Switch active preferred target to this surah
                        setIsSelectorModalOpen(false);
                        showToast(`Target hafalan diubah ke Surat ${s.nameLatin}`);
                      }}
                      className="w-full p-3 rounded-xl border border-slate-200 hover:border-emerald-500 flex items-center justify-between text-left transition"
                    >
                      <div>
                        <span className="text-xs font-bold text-slate-800">{s.number}. {s.nameLatin}</span>
                        <p className="text-[10px] text-slate-400">{s.translationId} ({s.totalVerses} ayat)</p>
                      </div>
                      <span className="font-quran text-lg text-emerald-800">{s.nameArabic}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: LOGIN / EMAIL AUTH */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-emerald-100 space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base text-slate-900">Sinkronisasi Akun Hafiz</h3>
                  <button onClick={() => setIsAuthModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={handleLogin} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Nama Santri:</label>
                    <input
                      type="text"
                      value={nameInput}
                      onChange={e => setNameInput(e.target.value)}
                      placeholder="Misal: Ahmad Fauzi"
                      className="w-full p-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Email:</label>
                    <input
                      type="email"
                      required
                      value={emailInput}
                      onChange={e => setEmailInput(e.target.value)}
                      placeholder="nama@email.com"
                      className="w-full p-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow hover:bg-emerald-700">
                    Masuk & Sinkronkan
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-400">
            <p>HAFIZ AI – Platform Hafalan Al-Qur'an 30 Juz Resmi Terverifikasi.</p>
            <p className="mt-1 text-[11px] text-slate-400">Standar Mushaf Uthmani & Terjemahan Resmi Kemenag RI • Murottal Syaikh Mishary Rashid Alafasy.</p>
          </footer>
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<HafizApp />);
  </script>
</body>
</html>
